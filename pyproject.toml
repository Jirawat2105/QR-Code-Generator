[project]
name = "muphoto-qr-studio"
version = "1.1.2"
description = "Tired of ads? Here, use this instead. A local QR code generator for Windows and Android."
license = "MIT"
authors = [{name = "Jirawat Pratuangtip"}]
requires-python = ">=3.13,<3.14"
dependencies = ["flet==1.1.3", "qrcode==8.2", "pillow==13.0.0"]

[dependency-groups]
dev = ["flet-cli==1.1.3", "flet-desktop==1.1.3", "flet-web==1.1.3", "pytest>=9", "pytest-asyncio", "zxing-cpp", "resvg-py", "playwright", "scikit-image", "pyinstaller", "pypdfium2"]

[tool.flet]
org = "com.muphoto"
product = "QR Generator"
company = "MuPhoto"
copyright = "Copyright (c) 2026 MuPhoto"
build_number = 4
artifact = "QRGenerator"

[tool.flet.app]
path = "src"

[tool.flet.android]
min_sdk_version = 24
target_sdk_version = 36
split_per_abi = true
legacy_packaging = true
impeller = true
target_arch = ["arm64-v8a", "x86_64"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
